apiVersion: v1
kind: Service
metadata:
  name: exoprep-admin-prod
  namespace: exoprep-prod
  labels:
    app: exoprep-admin-prod
    environment: production

spec:
  type: ClusterIP

  selector:
    app: exoprep-admin-prod

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
