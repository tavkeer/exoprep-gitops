apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exoprep-api-prod
  namespace: exoprep-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: api-prod.tavkeer.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exoprep-api-prod
                port:
                  number: 4000
