apiVersion: v1
kind: Service
metadata:
  name: exoprep-api-prod
  namespace: exoprep-prod
  labels:
    app: exoprep-api-prod
    environment: production

spec:
  type: ClusterIP

  selector:
    app: exoprep-api-prod

  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
