apiVersion: v1
kind: PersistentVolume
metadata:
  name: exoprep-uploads-prod-pv-v2
  labels:
    app.kubernetes.io/part-of: exoprep
    environment: production
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: exoprep-nfs
  claimRef:
    name: exoprep-uploads-prod
    namespace: exoprep-prod
  nfs:
    server: 192.168.0.107
    path: /data/k8s/uploads-prod
  mountOptions:
    - nfsvers=4

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exoprep-uploads-prod
  namespace: exoprep-prod
  labels:
    app.kubernetes.io/part-of: exoprep
    environment: production
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: exoprep-nfs
  volumeName: exoprep-uploads-prod-pv-v2
  resources:
    requests:
      storage: 10Gi
