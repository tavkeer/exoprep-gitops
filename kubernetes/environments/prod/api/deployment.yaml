apiVersion: apps/v1
kind: Deployment
metadata:
  name: exoprep-api-prod
  namespace: exoprep-prod
  labels:
    app: exoprep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exoprep
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: exoprep
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: api
          image: ghcr.io/harudh/exoprep-api:f800e5863296982940d86978542853b778881f99
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: exoprep-config-prod
            - secretRef:
                name: exoprep-secret

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          volumeMounts:
            - name: firebase-secret
              mountPath: /app/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true

            - name: uploads
              mountPath: /app/uploads

        - name: worker
          image: ghcr.io/harudh/exoprep-worker:f800e5863296982940d86978542853b778881f99
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: exoprep-config-prod
            - secretRef:
                name: exoprep-secret

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

      volumes:
        - name: firebase-secret
          secret:
            secretName: exoprep-secret
            items:
              - key: serviceAccountKey.json
                path: serviceAccountKey.json

        - name: uploads
          persistentVolumeClaim:
            claimName: exoprep-uploads-prod
