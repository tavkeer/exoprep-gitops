apiVersion: v1
kind: PersistentVolume
metadata:
  name: exoprep-uploads-pv

spec:
  capacity:
    storage: 10Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: exoprep-nfs

  nfs:
    server: 192.168.0.107
    path: /data/k8s/uploads

  mountOptions:
    - nfsvers=4

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exoprep-uploads
  namespace: exoprep

spec:
  accessModes:
    - ReadWriteMany

  storageClassName: exoprep-nfs

  resources:
    requests:
      storage: 10Gi
