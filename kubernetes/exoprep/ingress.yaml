apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exoprep-api
  namespace: exoprep
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

spec:
  ingressClassName: nginx

  rules:
    - host: api.tavkeer.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exoprep-api
                port:
                  number: 4000
