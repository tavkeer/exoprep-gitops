apiVersion: apps/v1
kind: Deployment
metadata:
  name: exoprep-api
  namespace: exoprep
  labels:
    app: exoprep

spec:
  replicas: 3

  selector:
    matchLabels:
      app: exoprep

  template:
    metadata:
      labels:
        app: exoprep

    spec:

      # Private GHCR authentication
      imagePullSecrets:
        - name: ghcr-pull-secret
          

      

      volumes:

        # Firebase service account
        - name: firebase-secret
          secret:
            secretName: exoprep-secret
            items:
              - key: serviceAccountKey.json
                path: serviceAccountKey.json

        # API uploads PDF here.
        # Worker reads the same files.
        - name: uploads
          persistentVolumeClaim:
            claimName: exoprep-uploads

      containers:

        # ==========================================
        # API
        # ==========================================

        - name: api

          image: ghcr.io/harudh/exoprep-api:0.2
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          ports:
            - name: http
              containerPort: 4000

          envFrom:
            - configMapRef:
                name: exoprep-config

            - secretRef:
                name: exoprep-secret

          volumeMounts:

            - name: firebase-secret
              mountPath: /app/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true

            - name: uploads
              mountPath: /app/uploads

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2


        # ==========================================
        # WORKER
        # ==========================================

        - name: worker

          image: ghcr.io/harudh/exoprep-worker:0.1
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000

          envFrom:
            - configMapRef:
                name: exoprep-config

            - secretRef:
                name: exoprep-secret

          volumeMounts:

            - name: uploads
              mountPath: /app/uploads

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "512Mi"
