apiVersion: v1
kind: ConfigMap
metadata:
  name: exoprep-config
  namespace: exoprep

data:
  PORT: "4000"
  NODE_ENV: "production"
  TZ: "Asia/Kolkata"

  REDIS_HOST: "192.168.0.107"
  REDIS_PORT: "6379"

  RATE_LIMIT_WINDOW_MS: "300000"
  RATE_LIMIT_MAX_REQUESTS: "250"
  REQUEST_TIMEOUT_MS: "30000"
  TRUST_PROXY: "1"

  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:4000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:4000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://192.168.0.238:3000,http://192.168.0.238:3001,http://192.168.0.102:3000,http://192.168.0.102:4000,http://192.168.0.107:3000,http://192.168.0.107:4000,https://exoprep.in,https://admin.exoprep.in,https://dashboard.exoprep.in"

  SMTP_HOST: "smtpout.secureserver.net"
  SMTP_PORT: "465"
  SMTP_FROM: "ExoPrep <info@harudh.in>"

  APP_DEEP_LINK_BASE: "https://dashboard.exoprep.in/invite"
  INVITE_LANDING_BASE_URL: "https://exoprep.in/invite"
  APP_DOWNLOAD_URL: ""

  MINIO_ENDPOINT: "http://192.168.0.107:9000"
  MINIO_BUCKET_NAME: "exoprep"
  MINIO_REGION: "us-east-1"
  MINIO_PUBLIC_BASE_URL: "https://images.exoprep.in/exoprep"

  GROQ_VISION_MODEL: "meta-llama/llama-4-scout-17b-16e-instruct"
