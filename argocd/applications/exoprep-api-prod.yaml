apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exoprep-api-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Harudh/exoprep-gitops.git
    targetRevision: main
    path: kubernetes/environments/prod/api

  destination:
    server: https://kubernetes.default.svc
    namespace: exoprep-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
